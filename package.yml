  en:
    name: WebUtils Toolbox
    description: "1088+ browser-side utilities: JSON formatting, Base64, QR codes, timestamps, image processing, text diff, encoding conversion and network lookups. Most tools run locally in your browser; files are not uploaded, and opening or saving files works with the box netdisk."
    usage: |
      WebUtils packs 1088 everyday tools into your box: development, text, image, generator, time, network and unit-conversion categories. Open it and start using it; there is no registration and no separate login step.

      How to use:
      1. The start page is the tool hub. Search by keyword (for example "JSON", "QR code", "timestamp") or browse the left-hand categories, then open a tool page.
      2. For tools that take a file (image compression, format conversion, text diff and others), the picker lets you choose a local file or a file from the box netdisk; results can be saved back to the netdisk.
      3. Each tool page has only its own options; processing happens in the browser and your content is not uploaded to third parties.

      Notes:
      - A few network tools (IP lookup, QR decoding and similar) call public third-party services; whether they work depends on your network. All other tools work offline.
      - Fonts and front-end libraries used by the tool pages ship inside the package; no external CDN is required.
      - No app account: access control is handled by the box account system, and the tools themselves store no user data.
